<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
</head>
<style>
    .main-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 5%;
        background-color: #101923;
        /* Couleur sombre identique au footer */
        font-family: 'Inter', sans-serif;
        position: sticky;
        top: 0;
        z-index: 1000;
    }

    /* Style du Logo */
    .main-header .logo {
        font-size: 32px;
        font-weight: 800;
        color: white;
        letter-spacing: -1px;
    }

    /* Menu de Navigation */
    .nav-menu {
        display: flex;
        gap: 30px;
    }

    .nav-menu a {
        color: white;
        text-decoration: none;
        font-size: 15px;
        font-weight: 500;
        transition: color 0.3s ease;
    }

    .nav-menu a:hover {
        color: #E6B856;
    }

    /* Actions (Panier + Bouton) */
    .header-actions {
        display: flex;
        align-items: center;
        gap: 25px;
    }

    .cart-icon {
        color: #E6B856;
        font-size: 20px;
        text-decoration: none;
    }

    /* Bouton Réserver */
    .btn-reserve {
        background: #A3730C;
        /* Couleur dorée foncée de ton image */
        color: white;
        text-decoration: none;
        padding: 12px 25px;
        border-radius: 50px;
        /* Bords très arrondis */
        font-weight: 600;
        font-size: 15px;
        display: flex;
        align-items: center;
        gap: 10px;
        transition: transform 0.2s ease, background 0.3s ease;
    }

    .btn-reserve:hover {
        background: #C5A059;
        transform: translateY(-2px);
    }

    /* Responsive : On cache le menu sur mobile (à adapter avec un menu burger plus tard) */
    @media (max-width: 900px) {
        .nav-menu {
            display: none;
        }
    }
</style>

<body>
    <header class="main-header">
        <div class="logo">Logo</div>

        <nav class="nav-menu">
            <a href="#">Accueil</a>
            <a href="#">À propos</a>
            <a href="#">Nos escapes</a>
            <a href="#">Nous trouver</a>
            <a href="#">Contact</a>
        </nav>

        <div class="header-actions">
            <a href="#" class="cart-icon">
                <i class="fa-solid fa-bag-shopping"></i>
            </a>
            <a href="#" class="btn-reserve">
                <i class="fa-regular fa-calendar-days"></i> Réserver
            </a>
        </div>
    </header>

</body>

</html>
