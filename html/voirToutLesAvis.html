<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voir tous les avis</title>
    <link rel="stylesheet" href="../styles/voirToutLesAvis.css">
</head>

<body>
    <main> <!-- affichage des avis  -->
        <!-- patern de l'affichege des avis avec Note puis message -->
        <div class="avis">
            <div class="container-avis">
                <div class="photo-de-profil">
                    <img src="../images/default-profile-picture.png" alt="Photo de profil">
                </div>
                <div class="contentAvis">
                    <div class="pseudo">$pseudo</div>
                    <div class="note">
                        <img src="../images/etoileAvisGrise.svg" alt="">
                        <img src="../images/etoileAvisGrise.svg" alt="">
                        <img src="../images/etoileAvisGrise.svg" alt="">
                        <img src="../images/etoileAvisGrise.svg" alt="">
                        <img src="../images/etoileAvisGrise.svg" alt="">
                    </div>
                </div>
            </div>
            <div class="message">
                $message
            </div>
        </div>
        <!-- fin du patern de l'affichege des avis avec Note puis message -->
    </main>
</body>

</html>
